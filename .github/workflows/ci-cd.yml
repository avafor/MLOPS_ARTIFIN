name: CI/CD for Iris Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Show repo structure
        run: ls -R
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run tests
        run: |
          poetry run pytest 03_dockerization_and_deployment/webservices/test_prediction_core.py

  cd:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: ci

    steps:
    - name: Build Docker image
      run: |
        docker build \
        -t ghcr.io/avafor/mlops_artifin/iris-predict-service:latest \
        03_dockerization_and_deployment/webservices

    - name: Push Docker image
      run: |
        docker push ghcr.io/avafor/mlops_artifin/iris-predict-service:latest      


          # docker pull ghcr.io/avafor/MLOPS_ARTIFIN/iris-service:latest
          # docker run -p 8000:8000 ghcr.io/avafor/MLOPS_ARTIFIN/iris-service:latest   