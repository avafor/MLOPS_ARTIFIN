name: CI/CD for Iris Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Get the code from GitHub
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          pip install poetry
          poetry install

      - name: Check that Python files can be imported
        run: |
          poetry run python -m py_compile 03_dockerization_and_deployment/webservices/predict.py

  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Get the code from GitHub
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t iris-predict-service:latest \
            03_dockerization_and_deployment/webservices
